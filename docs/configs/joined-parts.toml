[project]
show = 'Example Series'
out_dir = 'output'
work_dir = 'work'
output = '{show}.{ep}.mkv'

[episodes]
01 = ['media/part-01.mkv', 'media/part-02.mkv']

[VideoTrack.01]
source = '{episodes}'

[AudioTrack.01]
source = '{episodes}'
track = 0
codec = 'copy'

[mux]
'VideoTrack.01' = { name = 'Video', language = 'en-US', default = true }
'AudioTrack.01' = { name = 'Audio', language = 'en-US', default = true }
