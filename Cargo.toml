[package]
name = "muxcraft"
version = "0.1.1"
edition = "2024"
description = "Auditable batch remuxing driven by TOML"
license = "MPL-2.0"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = { version = "1.1.8", features = ["preserve_order"] }
indexmap = { version = "2.14.2", features = ["serde"] }
regex = "1.13.1"
walkdir = "2.5.0"
sha2 = "0.11.1"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "query", "rustls"] }
console = "0.16.6"
indicatif = "0.18.6"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
lto = "thin"
strip = true
