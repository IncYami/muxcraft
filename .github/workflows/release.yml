name: Build and release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
          - runner: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate release version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          cargo_version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          test "$GITHUB_REF_NAME" = "v$cargo_version"
      - name: Use current stable Rust
        run: rustup update stable
      - name: Test library
        run: cargo test --locked --lib
      - name: Build
        run: cargo build --release --locked
      - name: Check executable
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            target/release/muxcraft.exe --help
          else
            target/release/muxcraft --help
          fi
      - name: Package Unix binary
        if: runner.os != 'Windows'
        shell: bash
        run: |
          archive="muxcraft-${{ github.ref_name }}-${{ matrix.target }}.tar.gz"
          tar -C target/release -czf "$archive" muxcraft
      - name: Package Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = "muxcraft-${{ github.ref_name }}-${{ matrix.target }}.zip"
          Compress-Archive -Path target/release/muxcraft.exe -DestinationPath $archive
      - uses: actions/upload-artifact@v4
        with:
          name: muxcraft-${{ matrix.target }}
          path: |
            muxcraft-*.tar.gz
            muxcraft-*.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: muxcraft-*
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          sha256sum muxcraft-*.tar.gz muxcraft-*.zip > SHA256SUMS
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" muxcraft-*.tar.gz muxcraft-*.zip SHA256SUMS --clobber
          else
            gh release create "$RELEASE_TAG" muxcraft-*.tar.gz muxcraft-*.zip SHA256SUMS --verify-tag --generate-notes
          fi
