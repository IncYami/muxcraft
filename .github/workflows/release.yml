name: Build and release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: Identify build
        id: version
        run: |
          version=$(sed -n 's/^version = "\([0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\)"$/\1/p' Cargo.toml)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
          - runner: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - name: Use project Rust
        run: rustup toolchain install 1.99.1 --profile minimal --component clippy,rustfmt
      - name: Test library
        run: cargo test --locked --lib
      - name: Build
        run: cargo build --release --locked
      - name: Check executable
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            target/release/muxcraft.exe --version | grep -Fx "muxcraft ${{ needs.prepare.outputs.version }}"
          else
            target/release/muxcraft --version | grep -Fx "muxcraft ${{ needs.prepare.outputs.version }}"
          fi
      - name: Package Unix binary
        if: runner.os != 'Windows'
        shell: bash
        run: |
          archive="muxcraft-${{ needs.prepare.outputs.version }}-${{ matrix.target }}.tar.gz"
          tar -C target/release -czf "$archive" muxcraft
      - name: Package Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = "muxcraft-${{ needs.prepare.outputs.version }}-${{ matrix.target }}.zip"
          Compress-Archive -Path target/release/muxcraft.exe -DestinationPath $archive
      - uses: actions/upload-artifact@v7
        with:
          name: muxcraft-${{ matrix.target }}
          path: |
            muxcraft-*.tar.gz
            muxcraft-*.zip
          if-no-files-found: error

  release:
    if: github.ref == 'refs/heads/main'
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: muxcraft-*
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.version }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          sha256sum muxcraft-*.tar.gz muxcraft-*.zip > SHA256SUMS
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists for this commit."
          else
            gh release create "$RELEASE_TAG" muxcraft-*.tar.gz muxcraft-*.zip SHA256SUMS \
              --target "$COMMIT_SHA" \
              --title "muxcraft $RELEASE_TAG" \
              --notes "Build from main at commit $COMMIT_SHA." \
              --latest
          fi
